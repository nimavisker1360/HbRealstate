<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AI Robot">
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="face" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="eye-glow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#065f46" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" />
  <!-- Antenna -->
  <line x1="64" y1="24" x2="64" y2="14" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="11" r="5" fill="#6ee7b7">
    <animate attributeName="r" values="5;6;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Head/Face -->
  <rect x="28" y="28" width="72" height="64" rx="22" fill="url(#face)" filter="url(#shadow)" />
  <!-- Ears -->
  <rect x="18" y="46" width="10" height="20" rx="5" fill="#a7f3d0" />
  <rect x="100" y="46" width="10" height="20" rx="5" fill="#a7f3d0" />
  <!-- Eyes -->
  <circle cx="48" cy="56" r="11" fill="#065f46" />
  <circle cx="80" cy="56" r="11" fill="#065f46" />
  <circle cx="48" cy="56" r="6" fill="url(#eye-glow)">
    <animate attributeName="r" values="6;5;6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="56" r="6" fill="url(#eye-glow)">
    <animate attributeName="r" values="6;5;6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Eye shine -->
  <circle cx="44" cy="52" r="2.5" fill="#fff" opacity="0.8" />
  <circle cx="76" cy="52" r="2.5" fill="#fff" opacity="0.8" />
  <!-- Mouth -->
  <rect x="42" y="74" width="44" height="9" rx="4.5" fill="#10b981" />
  <rect x="50" y="76" width="5" height="5" rx="1" fill="#065f46" opacity="0.3" />
  <rect x="61" y="76" width="5" height="5" rx="1" fill="#065f46" opacity="0.3" />
  <rect x="72" y="76" width="5" height="5" rx="1" fill="#065f46" opacity="0.3" />
  <!-- Body hint -->
  <rect x="44" y="96" width="40" height="18" rx="9" fill="#a7f3d0" />
  <circle cx="54" cy="105" r="3" fill="#10b981" />
  <circle cx="64" cy="105" r="3" fill="#10b981" />
  <circle cx="74" cy="105" r="3" fill="#10b981" />
</svg>
